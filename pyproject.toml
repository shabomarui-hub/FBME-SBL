[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "torch-fast-sbl"
version = "1.1.0"
description = "Fourier-structured FBME-SBL solvers and independent SBL implementations"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["torch>=2.6,<2.7"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering",
]

[project.optional-dependencies]
triton = [
    "triton>=3.2,<3.3; platform_system == 'Linux'",
    "triton-windows>=3.2,<3.3; platform_system == 'Windows'",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["torch_sbl", "torch_sbl_fastest_stable", "torch_sbl_fastest_stable.*", "literature_reproduction"]
namespaces = false
